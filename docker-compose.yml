# Sobe apenas o banco PostgreSQL para desenvolvimento local.
services:
  db:
    image: postgres:16
    container_name: filavirtual-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fila123}
      POSTGRES_DB: ${POSTGRES_DB:-filavirtual}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  pgdata:
